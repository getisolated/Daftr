name: AI flow · agent code

# Agent code: implements plan.md until the fast check passes, commits, writes code-notes.md; the workflow re-runs the fast check and opens the draft PR.
# Called by the router (ai-router.yml) when the issue enters ai:code. Writes anywhere but the forbidden paths (zone "code"); the fast check is re-run after it.
# Prompt: .ai-flow/prompts/code.md.
on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      branch:
        type: string
        required: true
      run_dir:
        type: string
        required: true
      tour:
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  code:
    uses: ./.github/workflows/ai-agent-run.yml
    with:
      agent: code
      issue_number: ${{ inputs.issue_number }}
      branch: ${{ inputs.branch }}
      run_dir: ${{ inputs.run_dir }}
      tour: ${{ inputs.tour }}
      zone: code
      toolchain: true
      verify: true
      allowed_tools: "Read,Glob,Grep,Edit,Write,Bash(cd:*),Bash(cargo:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(bash .ai-flow-tools/scripts/ai-flow/fast-check.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git mv:*),Bash(ls:*),Bash(mkdir:*)"
    secrets: inherit

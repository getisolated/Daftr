name: AI flow · agent run (shared)

# Shared body of every agent job, called by the thin ai-agent-<name>.yml workflows (which
# the router calls). One run of one agent on one issue:
#
#   1. checkout the flow branch with the App token (pushes then come from the bot), and the
#      flow's own files (rules, prompts, scripts) from the default branch into .ai-flow-tools/:
#      the flow branch may predate them, and an agent must never run rules it could edit;
#   2. assemble .ai-flow-context.md at the root of the checkout (scripts/ai-flow/build-context.sh);
#   3. run Claude Code (claude-code-action, Max token) with the agent's prompt, turn budget
#      and model from .ai-flow/flow.env, and a structured result (.ai-flow/result-schema.json);
#   4. verify (code agent): re-run the fast check, report in <run_dir>/checks.md;
#   5. collect: check the changed paths, commit, push (scripts/ai-flow/collect.sh);
#   6. finalize: comment in the issue with the cost, set the next state label, or ai:erreur
#      (scripts/ai-flow/finalize-action.mjs). Runs even when a previous step failed.
on:
  workflow_call:
    inputs:
      agent:
        type: string
        required: true
      issue_number:
        type: number
        required: true
      branch:
        type: string
        required: true
      run_dir:
        type: string
        required: true
      tour:
        type: number
        required: true
      zone:
        description: '"run" (write only in the run folder) or "code" (anywhere but the forbidden paths)'
        type: string
        default: run
      allowed_tools:
        description: Claude Code tools the agent may use (--allowedTools)
        type: string
        required: true
      toolchain:
        description: Install Node and Rust, and the npm dependencies (agents that build or test)
        type: boolean
        default: false
      verify:
        description: Re-run the fast check after the agent (code agent); the finalisation requires it to pass
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  agent:
    name: Agent ${{ inputs.agent }} (#${{ inputs.issue_number }}, tour ${{ inputs.tour }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Work tree of the flow branch; the scripts take their own files from .ai-flow-tools/.
      AI_FLOW_WORKDIR: ${{ github.workspace }}
      TOOLS: ${{ github.workspace }}/.ai-flow-tools

    steps:
      - name: GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_FLOW_APP_ID }}
          private-key: ${{ secrets.AI_FLOW_APP_PRIVATE_KEY }}

      - name: Checkout flow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Checkout flow tools (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ai-flow-tools
          sparse-checkout: |
            .ai-flow
            scripts/ai-flow

      - name: Load flow configuration
        run: |
          # Never committed, never seen as a change of the agent.
          printf '%s\n' .ai-flow-tools/ .ai-flow-context.md >> .git/info/exclude
          bash "$TOOLS/scripts/ai-flow/export-env.sh"

      - name: Prepare
        id: prep
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT: ${{ inputs.agent }}
          ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        run: |
          set -euo pipefail
          # Commits are authored by the App's bot user (also passed to claude-code-action,
          # which otherwise sets its own claude[bot] identity).
          git config user.name "$AI_FLOW_BOT_LOGIN"
          git config user.email "${AI_FLOW_BOT_USER_ID}+${AI_FLOW_BOT_LOGIN}@users.noreply.github.com"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          upper="${AGENT^^}"
          turns_var="AI_FLOW_TURNS_${upper}"
          model_var="AI_FLOW_MODEL_${upper}"
          turns="${!turns_var:?no turn budget for $AGENT in flow.env}"
          model="${!model_var:?no model for $AGENT in flow.env}"
          schema="$(jq -c . "$TOOLS/.ai-flow/result-schema.json")"
          {
            echo "claude_args<<EOF_ARGS"
            echo "--max-turns $turns --model $model --allowedTools \"$ALLOWED_TOOLS\" --json-schema '$schema'"
            echo "EOF_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build agent context
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AI_FLOW_PM_LOGINS: ${{ vars.AI_FLOW_PM_LOGINS }}
          AI_FLOW_AGENT: ${{ inputs.agent }}
          AI_FLOW_TOUR: ${{ inputs.tour }}
        run: |
          # In the workspace, where Claude Code may read; excluded from git (see above).
          bash "$TOOLS/scripts/ai-flow/build-context.sh" "${{ inputs.issue_number }}" > .ai-flow-context.md
          echo "Context: $(wc -c < .ai-flow-context.md) bytes"

      - name: Setup Node.js
        if: inputs.toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        if: inputs.toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        if: inputs.toolchain
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system and npm dependencies
        if: inputs.toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
          npm ci

      # continue-on-error: the finalisation reports any failure in the issue (ai:erreur).
      - name: Run agent
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: ${{ env.AI_FLOW_BOT_USER_ID }}
          bot_name: ${{ env.AI_FLOW_BOT_LOGIN }}
          # The router runs agents on the bot's own labels.
          allowed_bots: ${{ env.AI_FLOW_BOT_LOGIN }},${{ env.AI_FLOW_APP_SLUG }}
          prompt: |
            Tu es l'agent ${{ inputs.agent }} du flux IA de Daftr.
            Issue : #${{ inputs.issue_number }} · tour : ${{ inputs.tour }} · limite de tours de questions (agent specs) : ${{ env.AI_FLOW_MAX_SPEC_ROUNDS }}.
            Branche de travail (déjà extraite) : ${{ inputs.branch }} · dossier du run : ${{ inputs.run_dir }}/
            Les règles du flux sont dans .ai-flow-tools/.ai-flow/ (version de référence, lecture seule).
            Lis dans l'ordre .ai-flow-tools/.ai-flow/CLAUDE.md, .ai-flow-tools/.ai-flow/prompts/${{ inputs.agent }}.md, puis .ai-flow-context.md, et exécute ta mission.
            Termine par le résultat structuré demandé (status, comment, summary).
          claude_args: ${{ steps.prep.outputs.claude_args }}

      # The agent says the check passes; the workflow checks it again, on what will be pushed.
      - name: Verify (fast check)
        id: verify
        if: always() && inputs.verify && steps.prep.outcome == 'success' && contains(steps.claude.outputs.structured_output, '"DONE"')
        continue-on-error: true
        run: |
          mkdir -p "${{ inputs.run_dir }}"
          bash "$TOOLS/scripts/ai-flow/fast-check.sh" "${{ inputs.run_dir }}/checks.md"

      - name: Collect agent output
        id: collect
        if: always() && steps.prep.outcome == 'success'
        env:
          AI_FLOW_AGENT: ${{ inputs.agent }}
          AI_FLOW_ISSUE: ${{ inputs.issue_number }}
          AI_FLOW_TOUR: ${{ inputs.tour }}
          AI_FLOW_RUN_DIR: ${{ inputs.run_dir }}
          AI_FLOW_BRANCH: ${{ inputs.branch }}
          AI_FLOW_ZONE: ${{ inputs.zone }}
          AI_FLOW_BASE_SHA: ${{ steps.prep.outputs.base_sha }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: bash "$TOOLS/scripts/ai-flow/collect.sh"

      - name: Finalize
        if: always() && steps.app.outcome == 'success'
        uses: actions/github-script@v8
        env:
          AI_FLOW_AGENT: ${{ inputs.agent }}
          AI_FLOW_ISSUE: ${{ inputs.issue_number }}
          AI_FLOW_TOUR: ${{ inputs.tour }}
          AI_FLOW_RUN_DIR: ${{ inputs.run_dir }}
          AI_FLOW_BRANCH: ${{ inputs.branch }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          FORBIDDEN: ${{ steps.collect.outputs.forbidden }}
          PUSH_ERROR: ${{ steps.collect.outcome == 'failure' && 'collect step failed' || steps.collect.outputs.push_error }}
          CHECKS_STATUS: ${{ steps.verify.outcome == 'success' && 'pass' || steps.verify.outcome == 'failure' && 'fail' || '' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { run } = await import(`${process.env.TOOLS}/scripts/ai-flow/finalize-action.mjs`);
            await run({ github, context, core });

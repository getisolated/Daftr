name: Build & Sign

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Cancel in-progress runs on the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The app compares its own version (package.json, read by tauri.conf.json) to the published one: it must match the tag
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Test (Angular)
        run: npm test

      - name: Check Rust (format, lint, tests)
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Everything Note, O=EvNote" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)
          echo "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Authenticode signature of the binaries and the installer (certificate of the runner store), plus the
      # minisign signature of the installer for the updater (private key in the repository secrets)
      - name: Build & package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $env:SIGN_THUMBPRINT; digestAlgorithm = 'sha256' } } }
          $config | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8 sign.json
          npx tauri build --config sign.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvNote-Windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      # The app polls this manifest (releases/latest/download/latest.json) to offer updates
      - name: Generate update manifest (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node scripts/update-manifest.mjs src-tauri/target/release/bundle/nsis \
            "${{ github.ref_name }}" "${{ github.repository }}" src-tauri/target/release/bundle/nsis/latest.json

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/latest.json
          draft: true
          generate_release_notes: true

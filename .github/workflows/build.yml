name: Build & Sign

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Cancel in-progress runs on the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # The app compares its own version (package.json) to the published one: it must match the tag
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm i
        
      - name: Test
        run: npm test

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Angular + Electron
        run: npm run build

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Everything Note, O=EvNote" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)
          $pwd = ConvertTo-SecureString -String "evnote-build" -Force -AsPlainText
          $pfxPath = "${{ runner.temp }}\cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxPath))
          echo "CSC_LINK=$base64" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=evnote-build" >> $env:GITHUB_ENV

      - name: Package & Sign
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvNote-Windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 30
          if-no-files-found: error

      # The app polls this manifest (releases/latest/download/latest.json) to offer updates
      - name: Generate update manifest (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls release/*Setup*.exe | head -n 1)
          # GitHub turns spaces into dots in asset names: the manifest must use the published name
          export FILENAME=$(basename "$INSTALLER" | tr ' ' '.')
          export SHA512=$(sha512sum "$INSTALLER" | cut -d ' ' -f 1)
          export VERSION="${TAG#v}"
          export URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/${FILENAME}"
          node -e "
            require('node:fs').writeFileSync('release/latest.json', JSON.stringify({
              version: process.env.VERSION,
              path: process.env.FILENAME,
              url: process.env.URL,
              sha512: process.env.SHA512,
            }, null, 2));
          "
          cat release/latest.json

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.json
          draft: true
          generate_release_notes: true

name: AI flow · agent specs

# Agent specs: analyses the request, asks the PM questions (checkboxes), then writes spec.md.
# Called by the router (ai-router.yml) when the issue enters ai:specs. Read-only on the
# code: it may only write in its run folder (zone "run"). Prompt: .ai-flow/prompts/specs.md.
on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      branch:
        type: string
        required: true
      run_dir:
        type: string
        required: true
      tour:
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  specs:
    uses: ./.github/workflows/ai-agent-run.yml
    with:
      agent: specs
      issue_number: ${{ inputs.issue_number }}
      branch: ${{ inputs.branch }}
      run_dir: ${{ inputs.run_dir }}
      tour: ${{ inputs.tour }}
      zone: run
      allowed_tools: Read,Glob,Grep,Edit,Write
    secrets: inherit

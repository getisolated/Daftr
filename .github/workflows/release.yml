name: Release

# Publie une release à chaque poussée sur `main` (fusion d'une pull request).
#
# La version est déduite des commits (Conventional Commits) depuis la dernière version
# publiée, c'est-à-dire le dernier tag `vX.Y.Z` :
#   - `BREAKING CHANGE` ou `type!:`  -> majeure
#   - `feat:`                        -> mineure
#   - tout le reste                  -> correctif
# Sans tag existant, la version déclarée dans `package.json` est publiée telle quelle.
#
# Une PR fusionnée par « squash » donne un seul commit dont le titre est celui de la PR :
# c'est lui qui décide du niveau d'incrément. Une fusion classique garde les commits de la
# PR, et le plus fort d'entre eux l'emporte.
#
# La version est ensuite écrite dans le dépôt (`scripts/stamp-version.mjs` : package.json,
# package-lock.json, Cargo.toml, Cargo.lock) par un commit `chore(release)` poussé sur `main` ;
# le build et le tag partent de ce commit, le dépôt porte donc toujours la version publiée.
# `main` étant protégée, ce push demande le secret `RELEASE_TOKEN` (PAT `contents: write`
# d'un compte autorisé à contourner la protection) ; sans lui, le jeton du workflow est tenté.
# Un commit dont le message contient `[skip release]` ne publie rien.
#
# Deux plateformes sont publiées : Windows (installeur NSIS) et macOS Apple Silicon (DMG,
# plus l'archive `.app.tar.gz` de l'updater). Chaque job de build ne produit que ses
# artefacts et leurs signatures minisign ; le job `release` fusionne le tout dans un seul
# `latest.json`, que l'application interroge à `releases/latest/download/latest.json` pour
# proposer les mises à jour. Une plateforme dont le build échoue bloque la release entière.
#
# Le build macOS n'est signé/notarisé par Apple que si les secrets `APPLE_*` existent ;
# sans eux il reste non signé (voir l'étape « Apple signing »).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deux poussées rapprochées ne doivent pas calculer la même version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if git log -1 --format=%B | grep -qF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Seuls les tags strictement `vX.Y.Z` sont des versions publiées
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$last" ]; then
            next=$(node -p "require('./package.json').version.replace(/[+-].*$/, '')")
          else
            if [ "$(git rev-list --count "$last..HEAD")" = "0" ]; then
              echo "No commit since $last."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")

            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi

            next="$major.$minor.$patch"
          fi

          if git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then
            echo "::error::Tag v$next already exists."
            exit 1
          fi

          echo "Publishing $next (previous: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  check:
    name: Checks
    needs: version
    if: needs.version.outputs.skip == 'false'
    uses: ./.github/workflows/ci.yml

  stamp:
    name: Stamp version
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write version into the repository
        run: node scripts/stamp-version.mjs "${{ needs.version.outputs.version }}"

      # Rien à commiter quand la version est déjà en place (build précédent échoué après le
      # commit) : le commit courant est alors publié tel quel.
      - name: Commit and push
        id: commit
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git add package.json frontend/package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): v$VERSION [skip release]"
            # Une fusion a pu arriver entre-temps : le commit est rejoué par-dessus
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build (Windows)
    needs: [version, stamp, check]
    runs-on: windows-latest

    steps:
      - name: Checkout stamped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri lit la version dans `package.json` (via `tauri.conf.json`) : le commit estampillé
      # doit porter celle qui sera publiée.
      - name: Check version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          actual=$(node -p "require('./package.json').version")
          [ "$actual" = "$APP_VERSION" ] || { echo "::error::package.json carries $actual, expected $APP_VERSION."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Daftr, O=Daftr" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)
          echo "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Signature Authenticode des binaires et de l'installeur (certificat du runner), et
      # signature minisign de l'installeur pour l'updater (clé privée dans les secrets)
      - name: Build & package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $env:SIGN_THUMBPRINT; digestAlgorithm = 'sha256' } } }
          $config | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8 sign.json
          npx tauri build --config sign.json

      # Une release sans installeur ni signature de mise à jour doit échouer plutôt que
      # paraître complète.
      - name: Check artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls src-tauri/target/release/bundle/nsis/*-setup.exe > /dev/null || { echo "::error::Installer missing."; exit 1; }
          ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig > /dev/null || { echo "::error::Update signature missing."; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  build-macos:
    name: Build (macOS)
    needs: [version, stamp, check]
    runs-on: macos-latest

    steps:
      - name: Checkout stamped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Le manifeste de mise à jour déclare `darwin-aarch64` : un runner Intel produirait
      # un binaire x86_64 publié sous la mauvaise clé.
      - name: Check architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "arm64" ] || { echo "::error::Runner is $(uname -m), arm64 expected."; exit 1; }

      - name: Check version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          actual=$(node -p "require('./package.json').version")
          [ "$actual" = "$APP_VERSION" ] || { echo "::error::package.json carries $actual, expected $APP_VERSION."; exit 1; }

      - name: Install dependencies
        run: npm ci

      # Le bundler Tauri signe et notarise dès que les variables `APPLE_*` sont définies, et
      # échoue si l'une est définie mais vide : or `${{ secrets.X }}` vaut une chaîne vide
      # quand le secret n'existe pas. Elles ne sont donc exportées que si un certificat est
      # fourni ; sinon le build reste non signé.
      - name: Apple signing (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate: building unsigned."
            exit 0
          fi
          # Une variable vide n'est jamais exportée (notarisation sans `APPLE_ID`, par exemple) ;
          # la syntaxe à délimiteur tolère un certificat base64 coupé sur plusieurs lignes.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || { echo "$name not set: skipped."; continue; }
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done

      # La config macOS (`tauri.macos.conf.json`) est fusionnée automatiquement ; la
      # signature minisign de l'archive de mise à jour utilise les mêmes secrets que Windows.
      - name: Build & package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Check artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          ls "$bundle"/dmg/*.dmg > /dev/null || { echo "::error::Disk image missing."; exit 1; }
          ls "$bundle"/macos/*.app.tar.gz > /dev/null || { echo "::error::Update archive missing."; exit 1; }
          ls "$bundle"/macos/*.app.tar.gz.sig > /dev/null || { echo "::error::Update signature missing."; exit 1; }

      # L'archive s'appelle toujours `Daftr.app.tar.gz` : sans version ni architecture dans
      # le nom, l'asset serait ambigu dans la release.
      - name: Rename update archive
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dir=src-tauri/target/release/bundle/macos
          mv "$dir"/Daftr.app.tar.gz "$dir/Daftr_${VERSION}_aarch64.app.tar.gz"
          mv "$dir"/Daftr.app.tar.gz.sig "$dir/Daftr_${VERSION}_aarch64.app.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: Publish release
    needs: [version, stamp, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      # Seul `scripts/` est utile ici (générateur du manifeste) : le commit estampillé suffit.
      - name: Checkout stamped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.stamp.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      # Le manifeste fusionne les deux plateformes : il est produit ici, où les installeurs,
      # leurs empreintes et leurs signatures sont tous connus.
      - name: Generate update manifest
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: node scripts/update-manifest.mjs artifacts "$TAG" "$REPO" artifacts/latest.json

      # `gh` est préinstallé sur les runners : pas d'action tierce à maintenir. Les `.sig` ne
      # sont pas publiés : leur contenu est dans le manifeste.
      # L'artefact macOS garde les sous-dossiers `dmg/` et `macos/` (`upload-artifact` prend
      # pour racine l'ancêtre commun de ses chemins) : d'où `**/`. `failglob` fait échouer la
      # publication si un des fichiers attendus manque, au lieu de passer le motif tel quel.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ needs.stamp.outputs.sha }}
        run: |
          shopt -s globstar failglob
          gh release create "$TAG" \
            artifacts/**/*-setup.exe artifacts/**/*.dmg artifacts/**/*.app.tar.gz artifacts/latest.json \
            --target "$TARGET" \
            --title "$VERSION" \
            --generate-notes \
            --latest

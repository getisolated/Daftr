<div class="menu-title">{{ i18n.t('profiles.menu.label') }}</div>

@for (profile of profiles.profiles(); track profile.id) {
  <div class="profile-row">
    <button
      class="menu-item profile"
      role="menuitemradio"
      type="button"
      [class.current]="profile.id === profiles.activeId()"
      [attr.aria-checked]="profile.id === profiles.activeId()"
      [title]="profile.id === profiles.activeId() ? i18n.t('profiles.menu.current') : label(profile)"
      (click)="picked.emit(profile)"
      (keydown.delete)="deletable(profile) && removed.emit(profile)"
    >
      <app-profile-avatar [name]="profile.name" [iconUrl]="profiles.iconUrl(profile.id)" [size]="20" />
      <span class="item-label">{{ label(profile) }}</span>
      @if (profile.protected) {
        <svg class="lock" [attr.aria-label]="i18n.t('profiles.menu.protected')" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      }
      @if (profile.id === profiles.activeId()) {
        <svg class="check" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 12 10 17 19 7"/>
        </svg>
      }
    </button>
    @if (deletable(profile)) {
      <button
        class="delete"
        type="button"
        tabindex="-1"
        [title]="i18n.t('profiles.menu.delete', { name: label(profile) })"
        [attr.aria-label]="i18n.t('profiles.menu.delete', { name: label(profile) })"
        (click)="removed.emit(profile)"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    }
  </div>
}

<div class="divider" role="separator"></div>

<button class="menu-item" role="menuitem" type="button" (click)="created.emit()">
  <svg class="item-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
  <span class="item-label">{{ i18n.t('profiles.menu.new') }}</span>
</button>
<button class="menu-item" role="menuitem" type="button" (click)="configured.emit()">
  <svg class="item-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  </svg>
  <span class="item-label">{{ i18n.t('profiles.menu.settings') }}</span>
</button>

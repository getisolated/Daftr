<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EvNote</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the saved theme before the first paint (no flash). Keep in sync with ThemeService / theme.util.ts / theme.model.ts.
    (function () {
      var themes = ['dark', 'light', 'solarized-light', 'violet-light', 'github-light', 'github-dark-dimmed'];
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('evn-theme');
        if (saved === 'system') {
          var prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          saved = localStorage.getItem(prefersDark ? 'evn-theme-dark' : 'evn-theme-light') || (prefersDark ? 'dark' : 'light');
        }
        if (themes.indexOf(saved) !== -1) {
          theme = saved;
        }
      } catch (e) { /* storage unavailable: dark */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <app-overlay></app-overlay>
</body>
</html>

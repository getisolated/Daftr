adapter-fs.workspace = true
adapter-mcp.workspace = true
adapter-password.workspace = true
adapter-print.workspace = true
adapter-sqlite.workspace = true
adapter-sync.workspace = true
app.workspace = true
domain.workspace = true
platform.workspace = true
presentation.workspace = true

anyhow.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
# Runtime de Tauri : le moteur de synchronisation y tourne
tokio = { workspace = true, features = ["rt", "time", "sync"] }
serde.workspace = true
tracing.workspace = true
window-vibrancy.workspace = true

[dev-dependencies]
adapter-sync = { workspace = true, features = ["testing"] }

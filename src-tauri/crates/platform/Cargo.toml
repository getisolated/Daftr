[package]
name = "platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Les lints du workspace, sauf `unsafe_code` : refusé partout (`deny`) mais autorisé sur le
# seul module qui appelle l'API Windows (`power/windows.rs`)
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

# La version que tauri tire déjà (`cargo tree -i windows-sys@0.61.2`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile.workspace = true
